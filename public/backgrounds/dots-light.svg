<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset="1" stop-color="#eaf0f7"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#29b6f6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#29b6f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9b8cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peach" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb199" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffb199" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.6" stop-color="#9fb0c4" stop-opacity="0"/>
      <stop offset="1" stop-color="#9fb0c4" stop-opacity="0.28"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1b2a3c" fill-opacity="0.09"/>
    </pattern>
    <radialGradient id="fadeGrad" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <mask id="dotsFade">
      <rect width="1920" height="1080" fill="#fff"/>
      <rect width="1920" height="1080" fill="url(#fadeGrad)"/>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- glow blobs -->
  <ellipse cx="300" cy="180" rx="620" ry="460" fill="url(#cyan)"/>
  <ellipse cx="1560" cy="260" rx="560" ry="420" fill="url(#violet)"/>
  <ellipse cx="1180" cy="940" rx="700" ry="400" fill="url(#cyan)" opacity="0.6"/>
  <ellipse cx="520" cy="900" rx="520" ry="340" fill="url(#peach)"/>

  <!-- dot grid -->
  <rect width="1920" height="1080" fill="url(#dots)" mask="url(#dotsFade)"/>

  <!-- soft rings -->
  <g fill="none" stroke="#0288d1" stroke-opacity="0.08">
    <circle cx="1500" cy="260" r="180"/>
    <circle cx="1500" cy="260" r="300"/>
    <circle cx="1500" cy="260" r="440"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
