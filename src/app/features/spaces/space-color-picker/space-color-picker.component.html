<fieldset>
  <legend class="form-label mb-3">Цвет</legend>

  <div class="flex flex-wrap gap-3">
    @for (color of colors; track color) {
      <label class="color-option" [style.--space-color]="colorValues[color]">
        <input
          type="radio"
          name="color"
          class="sr-only"
          [formControl]="control()"
          [value]="color"
        />

        <svg class="color-option-check" width="16" height="16" aria-hidden="true">
          <use href="/icons.svg#check" />
        </svg>

        <span class="sr-only">{{ colorLabels[color] }}</span>
      </label>
    }
  </div>
</fieldset>
