<a
  class="space-rail-link"
  routerLinkActive
  ariaCurrentWhenActive="page"
  draggable="false"
  [routerLink]="['/spaces', space().id, 'notes']"
  [title]="space().name"
  [attr.aria-label]="space().name"
  [style.--space-color]="colorValue()"
>
  <svg width="24" height="24" aria-hidden="true">
    <use [attr.href]="'/icons.svg#' + space().icon" />
  </svg>

  <span class="space-rail-label">{{ space().name }}</span>
</a>
