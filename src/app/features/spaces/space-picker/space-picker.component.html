<fieldset
  #picker
  class="@container flex min-w-0 flex-col gap-2"
  (focusout)="handleFocusOut($event, picker)"
>
  <legend class="sr-only">Пространства</legend>

  <div
    class="grid max-h-(--space-picker-max-height,16rem) grid-cols-1 gap-2 overflow-y-auto p-1 @xs:grid-cols-2"
  >
    @for (option of options(); track option.id) {
      <label
        class="flex min-h-12 shrink-0 cursor-pointer items-center gap-3 rounded-xl border border-line px-3 py-2 text-xs transition-colors duration-150 hover:bg-hover has-checked:border-accent/40 has-checked:bg-accent/10 has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-accent motion-reduce:transition-none"
      >
        <svg class="size-4 shrink-0" [style.color]="colorValues[option.color]" aria-hidden="true">
          <use [attr.href]="'/icons.svg#' + option.icon" />
        </svg>

        <span class="min-w-0 flex-1 wrap-break-word select-none">{{ option.name }}</span>

        <input
          #checkbox
          type="checkbox"
          class="peer sr-only"
          [checked]="selectedIds().includes(option.id)"
          [disabled]="disabled()"
          (change)="setSelected(option.id, checkbox.checked)"
        />

        <svg class="invisible size-4 shrink-0 text-accent peer-checked:visible" aria-hidden="true">
          <use href="/icons.svg#check" />
        </svg>
      </label>
    }
  </div>
</fieldset>
