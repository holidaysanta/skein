<div cdkMenu aria-label="Действия пространства" class="menu">
  <button cdkMenuItem type="button" class="menu-item" (cdkMenuItemTriggered)="editRequested.emit()">
    <svg width="16" height="16" class="shrink-0" aria-hidden="true">
      <use href="/icons.svg#pencil" />
    </svg>
    Редактировать
  </button>

  <button
    cdkMenuItem
    type="button"
    class="menu-item menu-item--danger"
    (cdkMenuItemTriggered)="deleteRequested.emit()"
  >
    <svg width="16" height="16" class="shrink-0" aria-hidden="true">
      <use href="/icons.svg#trash" />
    </svg>
    Удалить
  </button>
</div>
