<nav class="flex flex-col items-center w-30 gap-4 p-2" aria-label="Пространства">
  <a
    routerLink="/notes"
    routerLinkActive
    ariaCurrentWhenActive="page"
    class="space-rail-link"
    title="Все заметки"
    aria-label="Все заметки"
    style="--space-color: var(--accent)"
    draggable="false"
  >
    <svg width="24" height="24" aria-hidden="true">
      <use href="/icons.svg#notebook-text" />
    </svg>

    <span class="space-rail-label">Все</span>
  </a>

  <hr class="w-6 rounded-full border-line" />

  @for (space of spacesStore.spaces(); track space.id) {
    <app-space-rail-item [space]="space" />
  }

  <button
    class="button button--icon size-10.5 rounded-2xl border border-line/60 bg-transparent text-muted hover:bg-raised hover:text-fg hover:shadow-raised motion-safe:transition-[color,background-color,border-color,box-shadow,translate] duration-200 motion-safe:hover:-translate-y-0.5"
    type="button"
    aria-label="Создать пространство"
    (click)="openCreateSpaceDialog()"
  >
    <svg width="24" height="24" aria-hidden="true">
      <use href="/icons.svg#plus" />
    </svg>
  </button>
</nav>
