<nav class="flex flex-col items-center gap-3 p-2" aria-label="Пространства">
  <a
    routerLink="/notes"
    routerLinkActive
    ariaCurrentWhenActive="page"
    class="space-button"
    title="Все заметки"
    aria-label="Все заметки"
    style="--space-color: var(--accent)"
    draggable="false"
  >
    <svg width="24" height="24" aria-hidden="true">
      <use href="/icons.svg#notebook-text" />
    </svg>
  </a>

  <hr class="w-6 rounded-full border-line" />

  @for (space of spacesStore.spaces(); track space.id) {
    <app-space-rail-item [space]="space" />
  }

  <button
    class="button button--icon rounded-full border border-dashed bg-transparent text-muted hover:border-accent hover:bg-accent/10 hover:text-accent"
    type="button"
    aria-label="Создать пространство"
    (click)="openCreateSpaceDialog()"
  >
    <svg width="24" height="24" aria-hidden="true">
      <use href="/icons.svg#plus" />
    </svg>
  </button>
</nav>
