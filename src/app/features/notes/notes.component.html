<aside class="flex rounded-xl w-75 shrink-0 flex-col border border-line overflow-hidden bg-panel">
  @if (currentSpace(); as space) {
    <div class="flex items-center gap-3 p-4">
      <app-space-badge [icon]="space.icon" [color]="space.color" />

      <h2 class="min-w-0 flex-1 wrap-break-word font-semibold">{{ space.name }}</h2>

      <button
        class="button button--secondary shrink-0 px-3"
        type="button"
        aria-label="Действия пространства"
        [cdkMenuTriggerFor]="spaceMenu"
      >
        ...
      </button>

      <ng-template #spaceMenu>
        <div
          cdkMenu
          aria-label="Действия пространства"
          class="flex min-w-44 flex-col rounded-xl border border-line bg-panel p-1 shadow-lg"
        >
          <button
            cdkMenuItem
            type="button"
            class="rounded-lg px-3 py-2 text-left text-error hover:bg-hover focus:bg-hover"
            (cdkMenuItemTriggered)="openDeleteSpaceDialog(space)"
          >
            Удалить пространство
          </button>
        </div>
      </ng-template>
    </div>
  } @else if (!spaceId()) {
    <h2 class="p-4 font-semibold">Все заметки</h2>
  }

  <div class="p-4">
    <button type="button" class="button button--primary" (click)="openCreateNoteDialog()">
      Добавить новую заметку
    </button>
  </div>

  <nav class="flex flex-1 flex-col gap-2 overflow-y-auto px-2 pb-4">
    @for (note of visibleNotes(); track note.id) {
      <app-note-list-item
        [note]="note"
        [removeLabel]="spaceId() ? 'Убрать из пространства' : 'Удалить заметку'"
        (removeRequested)="removeNote(note.id)"
      />
    } @empty {
      <p class="px-2 text-muted">У вас нет ни одной заметки</p>
    }
  </nav>

  <app-theme-picker class="p-4" />
</aside>

<main #scrollContainer class="min-w-0 flex-1 overflow-y-auto">
  <router-outlet />
</main>
