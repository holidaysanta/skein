<div class="flex h-dvh">
  <aside class="flex w-75 shrink-0 flex-col overflow-hidden bg-panel">
    <div class="p-4">
      <button type="button" (click)="openCreate()">Добавить новую заметку</button>
    </div>

    <nav class="flex flex-1 flex-col gap-2 overflow-y-auto px-2 pb-4">
      @for (note of notesStore.notes(); track note.id) {
        <app-note-list-item [note]="note" (deleted)="deleteNote(note.id)" />
      } @empty {
        <p class="px-2 text-muted">У вас нет ни одной заметки</p>
      }
    </nav>
  </aside>

  <main class="min-w-0 flex-1 overflow-y-auto p-6">
    <router-outlet />
  </main>
</div>

@if (isCreateOpen()) {
  <app-modal (closed)="closeCreate()">
    <form (ngSubmit)="createNote()" class="flex flex-col gap-4">
      <input
        name="title"
        [(ngModel)]="draftTitle"
        [maxlength]="titleMaxLength"
        placeholder="Заголовок"
      />

      <div class="flex w-full justify-end gap-4">
        <button type="submit">Создать</button>
        <button type="button" (click)="closeCreate()">Отмена</button>
      </div>
    </form>
  </app-modal>
}
