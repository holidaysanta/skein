<aside class="flex w-75 shrink-0 flex-col overflow-hidden rounded-2xl border border-line bg-panel">
  @if (currentSpace(); as space) {
    <div class="flex items-center gap-3 p-4">
      <app-space-badge [icon]="space.icon" [color]="space.color" />

      <div class="min-w-0 flex-1">
        <h2 class="font-semibold wrap-break-word">{{ space.name }}</h2>
        <p class="mt-1 text-sm text-muted select-none">
          {{ noteCount() | i18nPlural: noteCountLabels }}
        </p>
      </div>

      <button
        class="button button--secondary button--icon rounded-full"
        type="button"
        aria-label="Действия пространства"
        [cdkMenuPosition]="menuPosition"
        [cdkMenuTriggerFor]="spaceMenu"
      >
        <svg width="16" height="16" class="shrink-0" aria-hidden="true">
          <use href="/icons.svg#ellipsis" />
        </svg>
      </button>

      <ng-template #spaceMenu>
        <div cdkMenu aria-label="Действия пространства" class="menu">
          <button
            cdkMenuItem
            type="button"
            class="menu-item"
            (cdkMenuItemTriggered)="openEditSpaceDialog(space)"
          >
            <svg width="16" height="16" class="shrink-0" aria-hidden="true">
              <use href="/icons.svg#pencil" />
            </svg>
            Редактировать
          </button>
          <button
            cdkMenuItem
            type="button"
            class="menu-item menu-item--danger"
            (cdkMenuItemTriggered)="openDeleteSpaceDialog(space)"
          >
            <svg width="16" height="16" class="shrink-0" aria-hidden="true">
              <use href="/icons.svg#trash" />
            </svg>
            Удалить
          </button>
        </div>
      </ng-template>
    </div>
  } @else if (!spaceId()) {
    <h2 class="p-4 font-semibold">Все заметки</h2>
  }

  <div class="p-4">
    <button
      type="button"
      class="button button--secondary w-full justify-start"
      (click)="openCreateNoteDialog()"
    >
      <svg width="16" height="16" [style.color]="spaceColorValue()" aria-hidden="true">
        <use href="/icons.svg#plus" />
      </svg>
      Новая заметка
    </button>
  </div>

  <nav class="flex flex-1 flex-col gap-2 overflow-y-auto px-2 pb-4">
    @for (note of visibleNotes(); track note.id) {
      <app-note-list-item
        [note]="note"
        [removeLabel]="spaceId() ? 'Убрать из пространства' : 'Удалить заметку'"
        (removeRequested)="removeNote(note.id)"
      />
    } @empty {
      <p class="p-3 text-center text-sm leading-relaxed text-balance text-muted select-none">
        {{ spaceId() ? 'Тема есть. Соберём главное?' : 'Сюда – всё, что хочется запомнить' }}
      </p>
    }
  </nav>

  <app-theme-picker class="p-4" />
</aside>

<main #scrollContainer class="min-w-0 flex-1 overflow-y-auto">
  <router-outlet [routerOutletData]="noteCount()" />
</main>
