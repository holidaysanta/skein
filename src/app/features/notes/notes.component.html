<div class="flex h-dvh">
  <aside
    class="flex m-3 rounded-xl w-75 shrink-0 flex-col border border-line overflow-hidden bg-panel"
  >
    <div class="p-4">
      <button type="button" (click)="openDialog()">Добавить новую заметку</button>
    </div>

    <nav class="flex flex-1 flex-col gap-2 overflow-y-auto px-2 pb-4">
      @for (note of notesStore.notes(); track note.id) {
        <app-note-list-item [note]="note" (deleted)="deleteNote(note.id)" />
      } @empty {
        <p class="px-2 text-muted">У вас нет ни одной заметки</p>
      }
    </nav>

    <app-theme-picker class="p-4" />
  </aside>

  <main #scrollContainer class="min-w-0 flex-1 overflow-y-auto">
    <router-outlet />
  </main>
</div>
