<input
  [ngModel]="note().title"
  (ngModelChange)="changed.emit({ title: $event })"
  [maxlength]="titleMaxLength"
  class="note-title outline-none"
/>
<textarea
  [ngModel]="note().text"
  (ngModelChange)="changed.emit({ text: $event })"
  class="flex-1 resize-none outline-none font-mono"
></textarea>
