@if (note(); as n) {
  <input
    class="text-4xl leading-normal font-bold outline-none"
    [ngModel]="n.title"
    (ngModelChange)="updateNote({ title: $event })"
    [maxlength]="titleMaxLength"
    placeholder="Заголовок"
  />

  @defer (on immediate) {
    <app-markdown-editor
      #editor
      class="flex-1"
      [showLoadingIndicator]="showLoadingIndicator()"
      [value]="n.text"
      (changed)="updateNote({ text: $event })"
    />
  } @loading {
    @if (stylesLoadFailed()) {
      <app-editor-load-error />
    } @else if (showLoadingIndicator()) {
      <app-editor-loading />
    }
  } @error {
    <app-editor-load-error />
  }
} @else {
  <p>Заметка не найдена</p>
}
