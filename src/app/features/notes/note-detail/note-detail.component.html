@if (note(); as n) {
  <input
    class="border-b border-line pb-4 text-3xl leading-normal font-bold outline-none"
    [ngModel]="n.title"
    (ngModelChange)="updateNote({ title: $event })"
    [maxlength]="titleMaxLength"
  />
  <app-markdown-editor
    [value]="n.text"
    class="flex-1 pr-4"
    (changed)="updateNote({ text: $event })"
  />
} @else {
  <p>Заметка не найдена</p>
}
