@if (note(); as n) {
  <input
    class="text-4xl leading-normal font-bold outline-none"
    [ngModel]="n.title"
    (ngModelChange)="updateNote({ title: $event })"
    [maxlength]="titleMaxLength"
    placeholder="Заголовок"
  />

  <app-markdown-editor [value]="n.text" class="flex-1" (changed)="updateNote({ text: $event })" />
} @else {
  <p>Заметка не найдена</p>
}
