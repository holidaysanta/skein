<div
  class="relative flex items-center gap-2 rounded-xl pl-6 pr-4 py-2.5 hover:bg-hover"
  routerLinkActive="bg-hover"
>
  <a [routerLink]="note().id" class="min-w-0 flex-1">
    <h3 class="truncate">{{ note().title }}</h3>
    <p class="truncate text-xs text-muted font-medium">
      {{ (note().text | markdownToPlain) || 'Пустая заметка' }}
    </p>
  </a>
  <button
    type="button"
    class="p-2 text-muted hover:text-fg"
    aria-label="Удалить заметку"
    (click)="deleted.emit()"
  >
    ✕
  </button>
</div>
